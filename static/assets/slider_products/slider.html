<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>axum slider</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="
    https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css
    " rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&display=swap" rel="stylesheet">
</head>

<body class="bg-light">
    <section class="promo_slider container mt-3">

        <div class="sl_content">
            <div class="item">
                <img class="img" src="img/p1.jpg">
                <img class="img" src="img/p2.jpg">
                <img class="img" src="img/p3.jpg">
            </div>
            <div class="item_name">
                <div class="title">item 1 name</div>
                <div class="title">item 2 name</div>
                <div class="title">item 3 name</div>
            </div>
            <div class="item_text">
                <div class="description">content 1 text</div>
                <div class="description">content 2 text</div>
                <div class="description">content 3 text</div>
            </div>
        </div>

        <div class="sl_trigger"></div>
    </section>


<link href="slider.css" rel="stylesheet">

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="slider.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>

</html>
